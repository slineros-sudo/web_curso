<body>
<style>
:root{
  --accent:#7C5CFF;--accent2:#00D4FF;--good:#3ED598;--bad:#FF6B6B;
  --glass:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.16);
  --text:#EAECFF;--text-dim:#A0A6CC;--radius:20px;--radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;
  background:linear-gradient(135deg,#1B1E3D 0%,#2A1B4A 50%,#141733 100%);
  background-attachment:fixed}
body::before{content:'';position:fixed;top:-10%;left:-10%;width:400px;height:400px;
  background:radial-gradient(circle,rgba(124,92,255,0.4),transparent 70%);border-radius:50%;filter:blur(40px);z-index:0}
body::after{content:'';position:fixed;bottom:-10%;right:-5%;width:350px;height:350px;
  background:radial-gradient(circle,rgba(0,212,255,0.3),transparent 70%);border-radius:50%;filter:blur(40px);z-index:0}
header{position:relative;z-index:1;padding:1.3rem 2rem;display:flex;align-items:center;justify-content:center;gap:1.3rem;flex-wrap:wrap;text-align:center}
.header-text{display:flex;flex-direction:column}
header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{font-size:0.85rem;color:var(--text-dim);margin-top:0.3rem}
.site-logo{height:52px;width:auto;cursor:pointer;transition:opacity 0.2s;flex-shrink:0}
.site-logo:hover{opacity:0.85}
.page-layout{position:relative;z-index:1;max-width:1280px;margin:1.5rem auto;padding:0 1.5rem;display:grid;grid-template-columns:1fr 340px;gap:1.8rem;align-items:start}
.month-nav{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:1.3rem}
.month-nav button{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:0.6rem 1rem;cursor:pointer;color:var(--text);font-size:0.85rem;backdrop-filter:blur(12px);transition:all 0.2s;font-family:inherit;font-weight:600}
.month-nav button:hover{background:var(--accent);transform:translateY(-2px)}
.month-nav h2{font-size:1.3rem;font-weight:600}
.cal-grid{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);background:rgba(124,92,255,0.2)}
.cal-header-row span{padding:0.9rem 0.5rem;text-align:center;font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.cal-header-row span.weekend{color:var(--bad)}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:90px;border:1px solid rgba(255,255,255,0.05);padding:0.6rem;position:relative;cursor:pointer;transition:all 0.25s}
.cal-cell.weekend{background:rgba(255,107,107,0.05)}
.cal-cell.has-events{background:rgba(124,92,255,0.15);border-color:rgba(124,92,255,0.4)}
.cal-cell.has-events:hover{background:rgba(124,92,255,0.3);transform:scale(1.05);z-index:2;border-radius:var(--radius-sm);box-shadow:0 0 20px rgba(124,92,255,0.5)}
.cal-cell.today{border:2px solid var(--accent2);background:rgba(0,212,255,0.1)}
.cal-cell .day-number{font-size:0.9rem;font-weight:600}
.cal-cell.weekend .day-number{color:var(--bad)}
.cal-cell.inactive .day-number{color:rgba(160,166,204,0.3)}
.cal-cell .event-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.cal-cell .event-preview{margin-top:0.4rem;font-size:0.6rem;color:var(--text-dim);line-height:1.3;overflow:hidden;max-height:34px}
.modal-overlay,.admin-modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,12,30,0.7);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:1.5rem}
.modal-overlay.active,.admin-modal-overlay.active{display:flex}
.admin-modal-overlay{z-index:1100}
.modal{background:rgba(30,33,60,0.95);border:1px solid var(--glass-border);border-radius:var(--radius);width:100%;max-width:750px;max-height:85vh;overflow:hidden;backdrop-filter:blur(24px);box-shadow:0 25px 80px rgba(0,0,0,0.5);animation:modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);display:flex;flex-direction:column}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(0.92)}to{opacity:1;transform:none}}
.modal-header{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:1.3rem 1.8rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h3{font-size:1.05rem;font-weight:600}
.close-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:34px;height:34px;border-radius:var(--radius-sm);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.close-btn:hover{background:rgba(255,255,255,0.35);transform:rotate(90deg)}
.modal-body{padding:1.8rem;overflow-y:auto;flex:1}
.activity-item{display:flex;gap:0.8rem;padding:1rem;border-radius:var(--radius-sm);border:1px solid var(--glass-border);margin-bottom:0.7rem;background:var(--glass);border-left:4px solid var(--accent);transition:all 0.2s;align-items:flex-start}
.activity-item:hover{transform:translateX(4px);box-shadow:0 4px 16px rgba(124,92,255,0.2)}
.act-text{flex:1;font-size:0.88rem;line-height:1.5;white-space:pre-line;word-break:break-word}
.act-delete{background:none;border:none;color:var(--bad);cursor:pointer;font-size:0.85rem;padding:0.3rem;border-radius:6px;transition:background 0.2s;flex-shrink:0}
.act-delete:hover{background:rgba(255,107,107,0.15)}
.activity-empty,.pp-empty{text-align:center;padding:2rem;color:var(--text-dim);font-size:0.88rem}
.admin-form{margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--glass-border);display:none}
.admin-form.visible{display:block}
.admin-form h4{font-size:0.75rem;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.8rem}
.admin-form textarea,.am-body input{width:100%;padding:0.8rem;font-size:0.85rem;font-family:inherit;border:1px solid var(--glass-border);border-radius:var(--radius-sm);background:var(--glass);color:var(--text);outline:none;transition:border-color 0.2s}
.admin-form textarea{resize:vertical;min-height:70px}
.admin-form textarea:focus,.am-body input:focus{border-color:var(--accent)}
.save-btn,.am-btn{margin-top:0.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:0.7rem 1.5rem;border-radius:var(--radius-sm);font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.save-btn:hover,.am-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,255,0.4)}
.save-btn:disabled{opacity:0.5;cursor:not-allowed}
.status-msg{font-size:0.75rem;margin-top:0.5rem;font-weight:600;display:none}
.status-msg.show{display:block}
.status-msg.error{color:var(--bad)}.status-msg.success{color:var(--good)}.status-msg.info{color:var(--accent2)}
.admin-modal{background:rgba(30,33,60,0.95);border:1px solid var(--glass-border);border-radius:var(--radius);width:100%;max-width:340px;overflow:hidden;backdrop-filter:blur(24px);animation:modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
.am-header{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:1.2rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.am-header h3{font-size:0.95rem;font-weight:600}
.am-body{padding:1.5rem}
.am-body input{margin-bottom:0.8rem}
.am-error{font-size:0.75rem;color:var(--bad);margin-bottom:0.5rem;display:none}
.am-error.show{display:block}
.am-btn{width:100%}
.panel-derecho{position:sticky;top:1.5rem}
.panel-proximos{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.panel-proximos-header{background:linear-gradient(135deg,var(--accent2),var(--accent));padding:1.3rem 1.5rem}
.pp-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.8px;opacity:0.9;margin-bottom:0.3rem}
.panel-proximos-header h3{font-size:1rem;font-weight:700}
.panel-proximos-body{padding:1.2rem}
.pp-day-section{margin-bottom:1.2rem}
.pp-day-section:last-child{margin-bottom:0}
.pp-day-title{font-size:0.72rem;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid var(--glass-border)}
.pp-event{display:flex;gap:0.7rem;padding:0.7rem;border-radius:var(--radius-sm);border:1px solid var(--glass-border);margin-bottom:0.5rem;background:var(--glass);transition:all 0.2s}
.pp-event:hover{transform:translateX(3px);border-color:var(--accent)}
.pp-event:last-child{margin-bottom:0}
.pp-event h5{font-size:0.78rem;font-weight:500;line-height:1.4;white-space:pre-line;word-break:break-word}
footer{position:relative;z-index:1;text-align:center;padding:2rem;font-size:0.75rem;color:var(--text-dim);grid-column:1/-1}
@media(max-width:1024px){.page-layout{grid-template-columns:1fr}.panel-derecho{position:static}}
@media(max-width:600px){header{flex-direction:column;gap:0.6rem;padding:1.1rem 1rem}.site-logo{height:44px}header h1{font-size:1.25rem}header p{font-size:0.78rem;margin-top:0.15rem}.cal-cell{min-height:55px;padding:0.3rem}.cal-cell .day-number{font-size:0.72rem}.cal-cell .event-preview{display:none}.cal-header-row span{font-size:0.6rem;padding:0.5rem 0.2rem}.page-layout{padding:0 0.8rem}.modal{max-width:95%}}
</style>

<script>
let schoolActivities = {};
const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const dayNames = ["Domingo","Lunes","Martes","Mi\u00e9rcoles","Jueves","Viernes","S\u00e1bado"];
let currentYear = 2026;
let displayMonth = (new Date().getFullYear()===currentYear) ? new Date().getMonth() : 0;
let selectedDateKey = "";
let isAdmin = false;
let adminPassCache = "";
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw84G8a3a79EjyarCHT8Ha78MZVMrp67tjZxaP3p7HPcg58J0KegqX9CJr-IV57b78SEg/exec";

function initCalendar() {
  loadFromBackend().then(()=>{renderCalendar();renderProximos();}).catch(()=>{renderCalendar();renderProximos();});
  document.getElementById('prevMonth').onclick = () => { displayMonth = displayMonth===0?11:displayMonth-1; renderCalendar(); };
  document.getElementById('nextMonth').onclick = () => { displayMonth = displayMonth===11?0:displayMonth+1; renderCalendar(); };
  document.getElementById('closeModal').onclick = () => document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalOverlay').onclick = (e) => { if(e.target===e.currentTarget) document.getElementById('modalOverlay').classList.remove('active'); };
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){document.getElementById('modalOverlay').classList.remove('active');document.getElementById('adminModalOverlay').classList.remove('active');}});
  document.getElementById('addActivityBtn').onclick = saveNewActivity;
  document.getElementById('newActivityInput').onkeypress = (e)=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')saveNewActivity();};
  document.getElementById('siteLogo').ondblclick = ()=>{ if(isAdmin){isAdmin=false;updateAdminUI();}else{openAdminModal();} };
  document.getElementById('closeAdminModal').onclick = closeAdminModal;
  document.getElementById('adminLoginBtn').onclick = ()=>{
    const pass=document.getElementById('adminPassword').value.trim();
    if(pass==='123456'){isAdmin=true;adminPassCache=pass;document.getElementById('adminPassword').value='';document.getElementById('adminError').classList.remove('show');closeAdminModal();updateAdminUI();}
    else{document.getElementById('adminError').classList.add('show');}
  };
  document.getElementById('adminPassword').onkeypress=(e)=>{if(e.key==='Enter')document.getElementById('adminLoginBtn').click();};
  updateAdminUI();
}
async function loadFromBackend(){
  const r=await fetch(`${BACKEND_URL}?year=${currentYear}`,{cache:"no-store"});
  const ct=r.headers.get("content-type")||"";
  const raw=ct.includes("application/json")?await r.json():await r.text();
  const obj=typeof raw==="object"?raw:(function(){try{return JSON.parse(raw);}catch{return {};}})();
  schoolActivities=normalizeData(obj);
}
function normalizeData(obj){
  const out={};
  if(!obj||typeof obj!=="object")return out;
  for(const k of Object.keys(obj)){
    const val=obj[k];
    let iso=null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(k)){iso=k;}
    else{const d=new Date(k);if(!isNaN(d.getTime())){iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}}
    if(iso){out[iso]=Array.isArray(val)?val.map(x=>String(x)):[];}
  }
  return out;
}
async function backendAdd(dateKey,text){
  const url=`${BACKEND_URL}?action=add&date=${encodeURIComponent(dateKey)}&text=${encodeURIComponent(text)}&password=${encodeURIComponent(adminPassCache)}&t=${Date.now()}`;
  try{
    const r=await fetch(url,{method:"GET",cache:"no-store"});
    const ct=r.headers.get("content-type")||"";
    const raw=ct.includes("application/json")?await r.json():await r.text();
    let obj=typeof raw==="object"?raw:(function(){try{return JSON.parse(raw);}catch{return null;}})();
    if(r.ok){
      if(obj&&Array.isArray(obj.activities)){schoolActivities[dateKey]=obj.activities;return{ok:true,list:schoolActivities[dateKey]};}
      if(obj&&typeof obj==="object"){schoolActivities=normalizeData(obj);return{ok:true,list:schoolActivities[dateKey]||[]};}
      await loadFromBackend();return{ok:true,list:schoolActivities[dateKey]||[]};
    }
    return{ok:false,list:schoolActivities[dateKey]||[],text:typeof raw==="string"?raw:JSON.stringify(raw)};
  }catch(e){return{ok:false,list:null,text:String(e)};}
}
async function backendDelete(dateKey,index){
  const url=`${BACKEND_URL}?action=delete&date=${encodeURIComponent(dateKey)}&index=${encodeURIComponent(String(index))}&password=${encodeURIComponent(adminPassCache)}&t=${Date.now()}`;
  try{
    const r=await fetch(url,{method:"GET",cache:"no-store"});
    const ct=r.headers.get("content-type")||"";
    const raw=ct.includes("application/json")?await r.json():await r.text();
    let obj=typeof raw==="object"?raw:(function(){try{return JSON.parse(raw);}catch{return null;}})();
    if(r.ok){
      if(obj&&Array.isArray(obj.activities)){schoolActivities[dateKey]=obj.activities;return{ok:true,list:schoolActivities[dateKey]};}
      if(obj&&typeof obj==="object"){schoolActivities=normalizeData(obj);return{ok:true,list:schoolActivities[dateKey]||[]};}
      await loadFromBackend();return{ok:true,list:schoolActivities[dateKey]||[]};
    }
    return{ok:false,list:schoolActivities[dateKey]||[],text:typeof raw==="string"?raw:JSON.stringify(raw)};
  }catch(e){return{ok:false,list:null,text:String(e)};}
}
function renderCalendar(){
  const body=document.getElementById('calendarDays');
  body.innerHTML='';
  document.getElementById('monthDisplay').textContent=`${monthNames[displayMonth]} ${currentYear}`;
  const firstDay=new Date(currentYear,displayMonth,1).getDay();
  const startOffset=(firstDay===0)?6:firstDay-1;
  const daysInMonth=new Date(currentYear,displayMonth+1,0).getDate();
  const prevDays=new Date(currentYear,displayMonth,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  for(let i=startOffset-1;i>=0;i--){
    const d=prevDays-i;
    const cell=document.createElement('div');
    cell.className='cal-cell inactive';
    const pos=startOffset-1-i;
    if(pos%7===5||pos%7===6)cell.classList.add('weekend');
    cell.innerHTML=`<span class="day-number">${d}</span>`;
    body.appendChild(cell);
  }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${currentYear}-${String(displayMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(currentYear,displayMonth,d).getDay();
    const isWeekend=(dow===0||dow===6);
    const isToday=(dateStr===todayStr);
    const events=schoolActivities[dateStr]||[];
    const cell=document.createElement('div');
    cell.className='cal-cell';
    if(isWeekend)cell.classList.add('weekend');
    if(isToday)cell.classList.add('today');
    if(events.length>0){
      cell.classList.add('has-events');
      cell.innerHTML=`<span class="event-dot"></span><span class="day-number">${d}</span><div class="event-preview">${events.slice(0,2).map(e=>e.length>20?e.slice(0,20)+'...':e).join(', ')}</div>`;
    }else{
      cell.innerHTML=`<span class="day-number">${d}</span>`;
    }
    cell.onclick=()=>openModal(d,displayMonth,currentYear,dateStr);
    body.appendChild(cell);
  }
  const totalCells=startOffset+daysInMonth;
  const rem=totalCells%7;
  if(rem>0){
    for(let d=1;d<=7-rem;d++){
      const cell=document.createElement('div');
      cell.className='cal-cell inactive';
      const pos=totalCells+d-1;
      if(pos%7===5||pos%7===6)cell.classList.add('weekend');
      cell.innerHTML=`<span class="day-number">${d}</span>`;
      body.appendChild(cell);
    }
  }
}
function renderProximos(){
  const panel=document.getElementById('panelProximos');
  const today=new Date();
  let html='';
  let found=0;
  for(let offset=1;offset<=60&&found<5;offset++){
    const d=new Date(today);d.setDate(d.getDate()+offset);
    const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const events=schoolActivities[dateStr]||[];
    if(events.length>0){
      found++;
      const label=offset===1?'Ma\u00f1ana':dayNames[d.getDay()];
      const dayNum=d.getDate();
      const monthIdx=d.getMonth();
      const yearNum=d.getFullYear();
      html+=`<div class="pp-day-section"><div class="pp-day-title"><i class="fas fa-calendar-day"></i> ${label} ${dayNum} de ${monthNames[monthIdx]}</div>`;
      html+=`<div class="pp-event" onclick="openModal(${dayNum},${monthIdx},${yearNum},'${dateStr}')" style="cursor:pointer;"><h5>${events[0].length>45?events[0].slice(0,45)+'...':events[0]}</h5>${events.length>1?`<span style="font-size:0.65rem;color:var(--text-dim);margin-left:auto;white-space:nowrap;">+${events.length-1} mas</span>`:''}</div>`;
      html+=`</div>`;
    }
  }
  panel.innerHTML=html||'<div class="pp-empty"><i class="fas fa-check-circle" style="color:var(--good);font-size:1.3rem;display:block;margin-bottom:0.5rem;"></i>Sin eventos pr\u00f3ximos</div>';
}
function openModal(day,month,year,dateKey){
  selectedDateKey=dateKey;
  document.getElementById('modalDateTitle').textContent=`${day} de ${monthNames[month]}, ${year}`;
  document.getElementById('newActivityInput').value='';
  hideStatus();
  updateActivityList();
  document.getElementById('modalOverlay').classList.add('active');
}
function updateActivityList(){
  const list=document.getElementById('activityList');
  const activities=schoolActivities[selectedDateKey]||[];
  if(activities.length===0){
    list.innerHTML='<div class="activity-empty"><i class="fas fa-calendar-check" style="font-size:1.5rem;opacity:0.4;display:block;margin-bottom:0.5rem;"></i>No hay actividades registradas.</div>';
  }else{
    list.innerHTML=activities.map((act,i)=>`
      <div class="activity-item">
        <span class="act-text">${act}</span>
        ${isAdmin?`<button class="act-delete" onclick="deleteActivity(${i})"><i class="fas fa-trash-alt"></i></button>`:''}
      </div>
    `).join('');
  }
}
function saveNewActivity(){
  if(!isAdmin){showStatus('Debe iniciar sesi\u00f3n de administrador.','error');return;}
  if(!selectedDateKey){showStatus('Seleccione un d\u00eda.','error');return;}
  const val=document.getElementById('newActivityInput').value.trim();
  if(!val){showStatus('Ingrese una actividad.','error');return;}
  document.getElementById('addActivityBtn').disabled=true;
  showStatus('Guardando...','info');
  backendAdd(selectedDateKey,val).then(res=>{
    if(!res||!res.ok||!Array.isArray(res.list)){showStatus('Error al guardar.','error');return;}
    schoolActivities[selectedDateKey]=res.list;
    document.getElementById('newActivityInput').value='';
    updateActivityList();renderCalendar();renderProximos();
    showStatus('Actividad guardada.','success');
  }).catch(()=>showStatus('Error de conexi\u00f3n.','error')).finally(()=>{document.getElementById('addActivityBtn').disabled=false;});
}
window.deleteActivity=function(index){
  if(!isAdmin)return;
  backendDelete(selectedDateKey,index).then(res=>{
    if(!res||!res.ok||!Array.isArray(res.list)){showStatus('Error al eliminar.','error');return;}
    schoolActivities[selectedDateKey]=res.list;
    updateActivityList();renderCalendar();renderProximos();
    showStatus('Actividad eliminada.','success');
  }).catch(()=>showStatus('Error de conexi\u00f3n.','error'));
};
function updateAdminUI(){
  const form=document.getElementById('adminOnlyForm');
  if(isAdmin){form.classList.add('visible');}
  else{form.classList.remove('visible');}
  updateActivityList();
}
function openAdminModal(){
  document.getElementById('adminError').classList.remove('show');
  document.getElementById('adminPassword').value='';
  document.getElementById('adminModalOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('adminPassword').focus(),100);
}
function closeAdminModal(){document.getElementById('adminModalOverlay').classList.remove('active');}
function showStatus(text,type){
  const el=document.getElementById('saveMsg');
  el.className='status-msg show '+type;
  el.textContent=text;
}
function hideStatus(){const el=document.getElementById('saveMsg');el.className='status-msg';el.textContent='';}
window.onload=initCalendar;
</script>
</body>
